name: AL-Go Issue Triage

# Automated first-pass triage for new issues.
#
# Security model, and the reason for the three jobs:
#
#   resolve   Deterministic extraction. No model, no write token.
#   triage    Runs Copilot CLI over the untrusted issue body. Holds NO write token. Its only
#             output is an artifact.
#   publish   Holds issues:write but NEVER runs a model. It schema-validates the artifact and
#             renders the comment itself.
#
# AL-Go is public, so an issue body is untrusted input from anyone on the internet, and AL-Go's
# templates execute in many other repositories. Keeping the reading job and the writing job apart,
# with a validated artifact between them, is what makes a successful prompt injection unable to
# write anything.
#
# Note that `issues:` events always run the copy of this file on the default branch. To test a
# change from a feature branch, dispatch it with `gh workflow run AiIssueTriage.yml --ref <branch>`.

# Note on triggers and testing:
#
#   issues: [labeled]   Opt-in. A maintainer adds the existing `AI Review` label to ask for triage
#                       on one issue. This reuses the convention the retired AiIssueTriager already
#                       established, so nothing fires automatically and no credits are spent
#                       without someone asking. Adding `issues: [opened]` later is what moves this
#                       to shadow mode across all new issues.
#
#   workflow_dispatch   The only way to test a change from a feature branch. `issues:` events
#                       always run the copy of this file on the default branch - there is no head
#                       ref for a repository-level event - whereas a dispatch runs the ref you
#                       select. That is why this file must land on the default branch before any
#                       branch testing is possible, and why it is inert by default.

on:
  # Opt-in trigger. If you comment this out to merge a dispatch-only first pull request, restore it
  # in the follow-up - see "The first pull request: two options" in
  # .github/agents/issue-triage/README.md.
  # issues:
  #   types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to triage
        required: true
        type: string
      dry_run:
        description: Render the comment and labels without posting them
        required: false
        type: boolean
        default: true
      target_repo:
        description: >-
          Repository to read the issue from, if different from the one this workflow runs in.
          Lets a private clone or internal repo triage real issues. Publishing is forced off
          whenever this differs from the running repository.
        required: false
        type: string
        default: ''

defaults:
  run:
    shell: pwsh

concurrency:
  group: issue-triage-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

env:
  _triageOutputDir: ${{ github.workspace }}/triage-output
  _issueNumber: ${{ github.event.issue.number || inputs.issue_number }}

jobs:
  resolve:
    name: Resolve issue context
    # Only act on the opt-in label, never on every labelling event.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'AI Review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Harden Runner
        if: github.repository_owner == 'microsoft'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract deterministic issue context
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRIAGE_ISSUE_NUMBER: ${{ env._issueNumber }}
          TRIAGE_TARGET_REPO: ${{ inputs.target_repo }}
          TRIAGE_OUTPUT_DIR: ${{ env._triageOutputDir }}
        run: |
          ./.github/agents/issue-triage/scripts/Invoke-CopilotIssueTriage.ps1 -Phase resolve

      - name: Upload issue context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: triage-context-${{ env._issueNumber }}
          path: ${{ env._triageOutputDir }}
          if-no-files-found: error

  triage:
    name: Triage
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      copilot-requests: write # bills Copilot inference to the organization; no PAT needed
    steps:
      - name: Harden Runner
        if: github.repository_owner == 'microsoft'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          # This job runs a tool-enabled model over untrusted issue content and holds GITHUB_TOKEN
          # for inference, so audit mode alone is not a control - it records exfiltration, it does
          # not stop it. Defence here is layered: the tool allow-list grants no network-capable
          # tool (no gh, curl or wget), the job has no write scope, and rendering happens in a
          # separate trusted job.
          #
          # TODO: switch to `egress-policy: block` with an allowed-endpoints list once the first
          # runs have recorded which endpoints Copilot CLI actually needs. Audit first, then block,
          # is the documented way to adopt this without guessing endpoints and breaking the run.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tool-enabled Copilot CLI runs in this job. Do not leave a token in .git/config
          # where a successful prompt injection could read it.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install Copilot CLI
        run: npm install --global @github/copilot@1.0.48

      - name: Download issue context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: triage-context-${{ env._issueNumber }}
          path: ${{ env._triageOutputDir }}

      - name: Run triage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRIAGE_OUTPUT_DIR: ${{ env._triageOutputDir }}
          TRIAGE_TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          ./.github/agents/issue-triage/scripts/Invoke-CopilotIssueTriage.ps1 -Phase triage

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: triage-findings-${{ env._issueNumber }}
          path: ${{ env._triageOutputDir }}
          if-no-files-found: warn

  publish:
    name: Publish
    needs: [resolve, triage]
    if: needs.triage.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden Runner
        if: github.repository_owner == 'microsoft'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deliberately the default branch, NOT the dispatched ref. This job holds issues: write,
          # and dispatching a feature branch is an encouraged part of the workflow, so running
          # branch-supplied code here would let anyone who can push a branch execute arbitrary code
          # with the write token - defeating the whole resolve/triage/publish trust boundary. The
          # findings artifact is data; the code that acts on it stays trusted.
          ref: ${{ github.event.repository.default_branch }}
          # This job posts via the REST API rather than git, so it needs no stored credentials.
          persist-credentials: false

      - name: Download findings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: triage-findings-${{ env._issueNumber }}
          path: ${{ env._triageOutputDir }}

      - name: Validate and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRIAGE_OUTPUT_DIR: ${{ env._triageOutputDir }}
          TRIAGE_TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          $dryRun = '${{ inputs.dry_run }}' -eq 'true'
          ./.github/agents/issue-triage/scripts/Invoke-CopilotIssueTriage.ps1 -Phase publish -DryRun:$dryRun

      - name: Upload rendered output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: triage-rendered-${{ env._issueNumber }}
          path: ${{ env._triageOutputDir }}
          if-no-files-found: warn

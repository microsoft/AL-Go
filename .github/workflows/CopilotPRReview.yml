name: BC PR Review (reusable)

# Security boundary:
# - review runs the tool-enabled model with read-only repository permissions.
# - publish can write PR comments but never runs the model.

on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        required: true
      head_sha:
        type: string
        required: true
      base_ref:
        type: string
        required: true
      target_repo:
        type: string
        required: false
        default: ${{ github.repository }}
      config_path:
        type: string
        required: false
        default: ''
      bcquality_repo:
        type: string
        required: false
        default: ''
      bcquality_ref:
        type: string
        required: false
        default: ''
      enabled_layers:
        type: string
        required: false
        default: ''
      disabled_skills:
        type: string
        required: false
        default: ''
      knowledge_allow:
        type: string
        required: false
        default: ''
      knowledge_deny:
        type: string
        required: false
        default: ''
      technologies:
        type: string
        required: false
        default: ''
      countries:
        type: string
        required: false
        default: ''
      application_area:
        type: string
        required: false
        default: ''
      bc_version:
        type: string
        required: false
        default: ''
      copilot_model:
        type: string
        required: false
        default: gpt-5.6-sol
      copilot_leaf_model:
        type: string
        required: false
        default: gpt-5.6-luna
      copilot_cli_version:
        type: string
        required: false
        default: '1.0.88'
      leaf_execution:
        type: string
        required: false
        default: serial
      max_leaf_concurrency:
        type: string
        required: false
        default: '4'
      minimum_severity:
        type: string
        required: false
        default: Medium
      agent_minimum_severity:
        type: string
        required: false
        default: ''
      max_findings_per_domain:
        type: string
        required: false
        default: '25'
      post_summary:
        type: string
        required: false
        default: 'false'
      fail_on_parse_error:
        type: string
        required: false
        default: 'true'
      embed_diff:
        type: string
        required: false
        default: 'false'
      cli_timeout_minutes:
        type: string
        required: false
        default: '30'
      agent_label:
        type: string
        required: false
        default: copilot-pr-review
      agent_version:
        type: string
        required: false
        default: ''
      agent_release_date:
        type: string
        required: false
        default: ''
      agent_release_version:
        type: string
        required: false
        default: ''
    secrets:
      bcqualityToken:
        description: Token with read access to a private BCQuality marketplace repository.
        required: false
    outputs:
      bcquality_sha:
        description: Resolved BCQuality commit SHA used for the review.
        value: ${{ jobs.review.outputs.bcquality_sha }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      copilot-requests: write
    defaults:
      run:
        shell: pwsh
    outputs:
      bcquality_sha: ${{ steps.review.outputs.bcqualitySha }}
    steps:
      - name: Checkout trusted target base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ inputs.base_ref }}
          path: trusted
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false

      - name: Generate Copilot PR review
        id: review
        uses: microsoft/AL-Go-Actions/ALReviewAgent@main
        with:
          phase: generate
          token: ${{ github.token }}
          bcqualityToken: ${{ secrets.bcqualityToken || github.token }}
          repository: ${{ inputs.target_repo }}
          workspace: ${{ github.workspace }}/trusted
          outputDirectory: ${{ github.workspace }}/review-output
          pullRequestNumber: ${{ inputs.pr_number }}
          headSha: ${{ inputs.head_sha }}
          baseRef: ${{ inputs.base_ref }}
          configPath: ${{ inputs.config_path && format('{0}/trusted/{1}', github.workspace, inputs.config_path) || '' }}
          bcqualityRepo: ${{ inputs.bcquality_repo }}
          bcqualityRef: ${{ inputs.bcquality_ref }}
          enabledLayers: ${{ inputs.enabled_layers }}
          disabledSkills: ${{ inputs.disabled_skills }}
          knowledgeAllow: ${{ inputs.knowledge_allow }}
          knowledgeDeny: ${{ inputs.knowledge_deny }}
          technologies: ${{ inputs.technologies }}
          countries: ${{ inputs.countries }}
          applicationArea: ${{ inputs.application_area }}
          bcVersion: ${{ inputs.bc_version }}
          model: ${{ inputs.copilot_model }}
          leafModel: ${{ inputs.copilot_leaf_model }}
          copilotCliVersion: ${{ inputs.copilot_cli_version }}
          leafExecution: ${{ inputs.leaf_execution }}
          maxLeafConcurrency: ${{ inputs.max_leaf_concurrency }}
          minimumSeverity: ${{ inputs.minimum_severity }}
          agentMinimumSeverity: ${{ inputs.agent_minimum_severity }}
          maxFindingsPerDomain: ${{ inputs.max_findings_per_domain }}
          failOnParseError: ${{ inputs.fail_on_parse_error }}
          embedDiff: ${{ inputs.embed_diff }}
          cliTimeoutMinutes: ${{ inputs.cli_timeout_minutes }}
          agentLabel: ${{ inputs.agent_label }}
          agentVersion: ${{ inputs.agent_version }}
          agentReleaseDate: ${{ inputs.agent_release_date }}
          agentReleaseVersion: ${{ inputs.agent_release_version }}

      - name: Upload review output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copilot-pr-review-output-${{ inputs.pr_number }}
          path: ${{ github.workspace }}/review-output
          if-no-files-found: warn

      - name: Upload BCQuality filter report
        if: always() && steps.review.outputs.filterReport != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bcquality-filter-report-${{ inputs.pr_number }}
          path: ${{ steps.review.outputs.filterReport }}
          if-no-files-found: warn

  publish:
    needs: review
    if: ${{ needs.review.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout trusted target base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ inputs.base_ref }}
          path: trusted
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false

      - name: Download review output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: copilot-pr-review-output-${{ inputs.pr_number }}
          path: ${{ github.workspace }}/review-output

      - name: Publish Copilot PR review
        uses: microsoft/AL-Go-Actions/ALReviewAgent@main
        with:
          phase: post
          token: ${{ github.token }}
          repository: ${{ inputs.target_repo }}
          workspace: ${{ github.workspace }}/trusted
          outputDirectory: ${{ github.workspace }}/review-output
          pullRequestNumber: ${{ inputs.pr_number }}
          headSha: ${{ inputs.head_sha }}
          baseRef: ${{ inputs.base_ref }}
          bcqualitySha: ${{ needs.review.outputs.bcquality_sha }}
          minimumSeverity: ${{ inputs.minimum_severity }}
          agentMinimumSeverity: ${{ inputs.agent_minimum_severity }}
          maxFindingsPerDomain: ${{ inputs.max_findings_per_domain }}
          postSummary: ${{ inputs.post_summary }}
          failOnParseError: ${{ inputs.fail_on_parse_error }}
          agentLabel: ${{ inputs.agent_label }}
          agentVersion: ${{ inputs.agent_version }}
          agentReleaseDate: ${{ inputs.agent_release_date }}
          agentReleaseVersion: ${{ inputs.agent_release_version }}

      - name: Upload published review artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copilot-pr-review-final-${{ inputs.pr_number }}
          path: ${{ github.workspace }}/review-output
          if-no-files-found: warn

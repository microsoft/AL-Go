name: Copilot PR Review Runner

on:
  workflow_run:
    workflows: [ Copilot PR Review ]
    types: [ completed ]

concurrency:
  group: copilot-pr-review-runner-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  ALGoOrgSettings: ${{ vars.ALGoOrgSettings }}
  ALGoRepoSettings: ${{ vars.ALGoRepoSettings }}

jobs:
  Settings:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      enabled: ${{ steps.output.outputs.enabled }}
      model: ${{ steps.output.outputs.model }}
      leafModel: ${{ steps.output.outputs.leafModel }}
      eligible: ${{ steps.output.outputs.eligible }}
      prNumber: ${{ steps.output.outputs.prNumber }}
      headSha: ${{ steps.output.outputs.headSha }}
      baseRef: ${{ steps.output.outputs.baseRef }}
    steps:
      - name: Checkout trusted settings
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download pull request metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: copilot-pr-review-metadata
          path: .copilot-pr-review-metadata
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read settings
        uses: microsoft/AL-Go-Actions/ReadSettings@main
        with:
          shell: pwsh
          project: ''
          workflowName: ''
          get: CodeReviewAgent

      - name: Set output
        id: output
        run: |
          $codeReviewAgent = $env:CodeReviewAgent | ConvertFrom-Json
          $event = Get-Content -Path '.copilot-pr-review-metadata/event.json' -Encoding UTF8 -Raw | ConvertFrom-Json
          $owner = [string] $event.pull_request.user.login
          $excludedOwners = @($codeReviewAgent.excludedOwners)
          $eligible = -not $event.pull_request.draft -and $owner -notin $excludedOwners

          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "enabled=$($codeReviewAgent.enabled.ToString().ToLowerInvariant())"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "model=$($codeReviewAgent.model)"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "leafModel=$($codeReviewAgent.leafModel)"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "eligible=$($eligible.ToString().ToLowerInvariant())"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "prNumber=$($event.pull_request.number)"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "headSha=$($event.pull_request.head.sha)"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "baseRef=$($event.pull_request.base.ref)"

  Review:
    needs: Settings
    if: needs.Settings.outputs.enabled == 'true' && needs.Settings.outputs.eligible == 'true'
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
      copilot-requests: write
    uses: ./.github/workflows/_CopilotPRReview.yaml
    secrets:
      bcquality_token: ${{ secrets.BCQUALITY_TOKEN }}
    with:
      pr_number: ${{ needs.Settings.outputs.prNumber }}
      head_sha: ${{ needs.Settings.outputs.headSha }}
      base_ref: ${{ needs.Settings.outputs.baseRef }}
      target_repo: ${{ github.repository }}
      engine_ref: main
      copilot_model: ${{ needs.Settings.outputs.model }}
      copilot_leaf_model: ${{ needs.Settings.outputs.leafModel }}

name: Copilot PR Review Runner

on:
  workflow_run:
    workflows: [ Copilot PR Review ]
    types: [ completed ]

concurrency:
  group: copilot-pr-review-runner-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  CopilotPRReview:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
      copilot-requests: write
    uses: ./.github/workflows/_CopilotPRReview.yaml
    secrets:
      BCQUALITY_TOKEN: ${{ secrets.BCQUALITY_TOKEN }}
    with:
      workflowRunId: ${{ github.event.workflow_run.id }}
      workflowHeadSha: ${{ github.event.workflow_run.head_sha }}

name: Copilot PR Review Runner

on:
  workflow_run:
    workflows: [ Copilot PR Review ]
    types: [ completed ]

concurrency:
  group: copilot-pr-review-runner-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  ALGoOrgSettings: ${{ vars.ALGoOrgSettings }}
  ALGoRepoSettings: ${{ vars.ALGoRepoSettings }}

jobs:
  Settings:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      enabled: ${{ steps.pullRequest.outputs.enabled }}
      eligible: ${{ steps.pullRequest.outputs.eligible }}
      prNumber: ${{ steps.pullRequest.outputs.prNumber }}
      headSha: ${{ steps.pullRequest.outputs.headSha }}
      baseRef: ${{ steps.pullRequest.outputs.baseRef }}
      model: ${{ steps.pullRequest.outputs.model }}
      leafModel: ${{ steps.pullRequest.outputs.leafModel }}
    steps:
      - name: Checkout trusted settings
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read settings
        uses: microsoft/AL-Go-Actions/ReadSettings@main
        with:
          shell: pwsh
          project: ''
          workflowName: ''
          get: CodeReviewAgent

      - name: Validate pull request
        id: pullRequest
        uses: microsoft/AL-Go-Actions/DetermineCopilotPRReview@main
        with:
          shell: pwsh
          pullRequestNumber: ${{ github.event.workflow_run.pull_requests[0].number }}
          workflowHeadSha: ${{ github.event.workflow_run.head_sha }}
          workflowHeadOwner: ${{ github.event.workflow_run.head_repository.owner.login }}
          workflowHeadBranch: ${{ github.event.workflow_run.head_branch }}
          codeReviewAgent: ${{ env.CodeReviewAgent }}

  Review:
    needs: Settings
    if: needs.Settings.outputs.enabled == 'true' && needs.Settings.outputs.eligible == 'true' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
      copilot-requests: write
    uses: ./.github/workflows/CopilotPRReview.yml
    secrets: inherit
    with:
      pr_number: ${{ needs.Settings.outputs.prNumber }}
      head_sha: ${{ needs.Settings.outputs.headSha }}
      base_ref: ${{ needs.Settings.outputs.baseRef }}
      target_repo: ${{ github.repository }}
      copilot_model: ${{ needs.Settings.outputs.model }}
      copilot_leaf_model: ${{ needs.Settings.outputs.leafModel }}

name: Copilot PR Review Runner

on:
  workflow_run:
    workflows: [ Copilot PR Review ]
    types: [ completed ]

concurrency:
  group: copilot-pr-review-runner-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  ALGoOrgSettings: ${{ vars.ALGoOrgSettings }}
  ALGoRepoSettings: ${{ vars.ALGoRepoSettings }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ENGINE_REPO: microsoft/AL-Go
  ENGINE_REF: main

jobs:
  Settings:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      enabled: ${{ steps.output.outputs.enabled }}
      model: ${{ steps.output.outputs.model }}
      leafModel: ${{ steps.output.outputs.leafModel }}
      eligible: ${{ steps.output.outputs.eligible }}
      prNumber: ${{ steps.output.outputs.prNumber }}
      headSha: ${{ steps.output.outputs.headSha }}
      baseRef: ${{ steps.output.outputs.baseRef }}
    steps:
      - name: Checkout trusted settings
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download pull request metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: copilot-pr-review-metadata
          path: .copilot-pr-review-metadata
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read settings
        uses: microsoft/AL-Go-Actions/ReadSettings@main
        with:
          shell: pwsh
          project: ''
          workflowName: ''
          get: CodeReviewAgent

      - name: Set output
        id: output
        run: |
          $codeReviewAgent = $env:CodeReviewAgent | ConvertFrom-Json
          $event = Get-Content -Path '.copilot-pr-review-metadata/event.json' -Encoding UTF8 -Raw | ConvertFrom-Json
          $owner = [string] $event.pull_request.user.login
          $excludedOwners = @($codeReviewAgent.excludedOwners)
          $eligible = -not $event.pull_request.draft -and $owner -notin $excludedOwners

          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "enabled=$($codeReviewAgent.enabled.ToString().ToLowerInvariant())"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "model=$($codeReviewAgent.model)"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "leafModel=$($codeReviewAgent.leafModel)"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "eligible=$($eligible.ToString().ToLowerInvariant())"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "prNumber=$($event.pull_request.number)"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "headSha=$($event.pull_request.head.sha)"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "baseRef=$($event.pull_request.base.ref)"

  resolve:
    needs: Settings
    if: needs.Settings.outputs.enabled == 'true' && needs.Settings.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
    steps:
      - name: Validate pull request metadata
        id: pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.Settings.outputs.prNumber }}
          PR_HEAD_SHA: ${{ needs.Settings.outputs.headSha }}
          PR_BASE_REF: ${{ needs.Settings.outputs.baseRef }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GITHUB_TOKEN"
            'User-Agent' = 'al-go-copilot-review'
          }
          $uri = "$($env:GITHUB_API_URL.TrimEnd('/'))/repos/$($env:GITHUB_REPOSITORY)/pulls/$($env:PR_NUMBER)"
          $pullRequest = Invoke-RestMethod -Uri $uri -Headers $headers -Method GET

          if ($pullRequest.head.sha -ne $env:PR_HEAD_SHA -or $pullRequest.head.sha -ne $env:WORKFLOW_HEAD_SHA) {
            throw 'Pull request head SHA does not match the triggering workflow run.'
          }
          if ($pullRequest.base.ref -ne $env:PR_BASE_REF) {
            throw 'Pull request base branch does not match the intake metadata.'
          }
          if ($pullRequest.state -ne 'open' -or $pullRequest.draft) {
            throw 'Pull request is no longer eligible for review.'
          }

          "number=$($pullRequest.number)" >> $env:GITHUB_OUTPUT
          "head_sha=$($pullRequest.head.sha)" >> $env:GITHUB_OUTPUT
          "base_ref=$($pullRequest.base.ref)" >> $env:GITHUB_OUTPUT
  review:
    needs: [Settings, resolve]
    if: ${{ needs.resolve.outputs.pr_number != '' && needs.resolve.outputs.head_sha != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read       # resolve PR metadata only
      copilot-requests: write   # bill Copilot inference to the org
    defaults:
      run:
        shell: pwsh
    outputs:
      bcquality_sha: ${{ steps.bcquality.outputs.sourceCommit }}
    steps:
      - name: Checkout engine scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          path: engine
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted target base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.resolve.outputs.base_ref }}
          path: trusted
          fetch-depth: 0
          token: ${{ github.token }}
          # The tool-enabled Copilot CLI runs in this job; do not leave a token
          # in .git/config where a successful prompt-injection could read it.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Validate Copilot CLI compatibility pin
        id: copilot-cli
        shell: pwsh
        env:
          REQUESTED_COPILOT_CLI_VERSION: 1.0.88
        run: |
          $requested = $env:REQUESTED_COPILOT_CLI_VERSION.Trim()
          if ($requested -notmatch '\A(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-(?:0|[1-9]\d*))?\z') {
            throw "copilot_cli_version must be an exact semantic version; received '$requested'."
          }
          $policyPath = "${{ github.workspace }}/engine/Review/ALReviewAgent/copilot-cli-compatibility.psd1"
          $policy = Import-PowerShellDataFile -Path $policyPath -ErrorAction Stop
          if ($policy.schema_version -ne 1 -or -not $policy.supported_versions.ContainsKey($requested)) {
            throw "Copilot CLI version '$requested' has not been compatibility-validated by the engine policy."
          }
          "version=$requested" >> $env:GITHUB_OUTPUT

      - name: Install Copilot CLI
        shell: pwsh
        env:
          COPILOT_CLI_VERSION: ${{ steps.copilot-cli.outputs.version }}
        run: |
          npm install --global "@github/copilot@$env:COPILOT_CLI_VERSION"
          copilot --version

      - name: Install powershell-yaml
        run: |
          if (-not (Get-Module -ListAvailable -Name powershell-yaml)) {
            Install-Module powershell-yaml -Scope CurrentUser -Force -AllowClobber
          }

      - name: Resolve BCQuality policy
        id: bcquality-policy
        env:
          BCQUALITY_CONFIG_PATH: ''
          BCQUALITY_REPO: ''
          BCQUALITY_REF: ''
          BCQUALITY_ENABLED_LAYERS: ''
          BCQUALITY_DISABLED_SKILLS: ''
          BCQUALITY_KNOWLEDGE_ALLOW: ''
          BCQUALITY_KNOWLEDGE_DENY: ''
          BCQUALITY_TECHNOLOGIES: ''
          BCQUALITY_COUNTRIES: ''
          BCQUALITY_APPLICATION_AREA: ''
          BCQUALITY_BC_VERSION: ''
        run: |
          $cfg = & "${{ github.workspace }}/engine/Review/ALReviewAgent/scripts/Get-BCQualityConfig.ps1"
          $repoUri = [Uri]$cfg.bcquality.repo
          if ($repoUri.Host -ne 'github.com') {
            throw "BCQuality marketplace must be hosted on github.com; received '$($cfg.bcquality.repo)'."
          }
          $marketplace = $repoUri.AbsolutePath.Trim('/')
          if ($marketplace -notmatch '^[^/]+/[^/]+$') {
            throw "BCQuality marketplace URL must identify one owner/repository; received '$($cfg.bcquality.repo)'."
          }
          $pluginVersion = [string]$cfg.bcquality['plugin-version']
          if (-not $pluginVersion) {
            throw 'bcquality.plugin-version is required for plugin identity validation.'
          }

          "marketplace=$marketplace" >> $env:GITHUB_OUTPUT
          "marketplaceRef=$($cfg.bcquality.ref)" >> $env:GITHUB_OUTPUT
          "pluginVersion=$pluginVersion" >> $env:GITHUB_OUTPUT
          "enabledLayers=$(@($cfg['enabled-layers']) -join ',')" >> $env:GITHUB_OUTPUT
          "disabledSkills=$(@($cfg['disabled-skills']) -join ',')" >> $env:GITHUB_OUTPUT
          "knowledgeAllow=$(@($cfg.knowledge.allow) -join ',')" >> $env:GITHUB_OUTPUT
          "knowledgeDeny=$(@($cfg.knowledge.deny) -join ',')" >> $env:GITHUB_OUTPUT

      - name: Install and filter BCQuality plugin
        id: bcquality
        uses: ./engine/Actions/SetupBCQuality
        with:
          shell: pwsh
          marketplace: ${{ steps.bcquality-policy.outputs.marketplace }}
          marketplaceRef: ${{ steps.bcquality-policy.outputs.marketplaceRef }}
          expectedPluginVersion: ${{ steps.bcquality-policy.outputs.pluginVersion }}
          enabledLayers: ${{ steps.bcquality-policy.outputs.enabledLayers }}
          disabledSkills: ${{ steps.bcquality-policy.outputs.disabledSkills }}
          knowledgeAllow: ${{ steps.bcquality-policy.outputs.knowledgeAllow }}
          knowledgeDeny: ${{ steps.bcquality-policy.outputs.knowledgeDeny }}
          token: ${{ steps.bcquality-policy.outputs.marketplace != 'microsoft/BCQuality' && secrets.BCQUALITY_TOKEN || '' }}

      - name: Run Copilot PR review (generate findings)
        env:
          REVIEW_PHASE: generate
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REVIEW_WORKSPACE: ${{ github.workspace }}/trusted
          REVIEW_OUTPUT_DIR: ${{ github.workspace }}/review-output
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          PR_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          BCQUALITY_ROOT: ${{ steps.bcquality.outputs.pluginRoot }}
          BCQUALITY_SHA: ${{ steps.bcquality.outputs.sourceCommit }}
          BCQUALITY_CONFIG_PATH: ''
          BCQUALITY_REPO: ''
          BCQUALITY_REF: ''
          BCQUALITY_ENABLED_LAYERS: ''
          BCQUALITY_DISABLED_SKILLS: ''
          BCQUALITY_KNOWLEDGE_ALLOW: ''
          BCQUALITY_KNOWLEDGE_DENY: ''
          BCQUALITY_TECHNOLOGIES: ''
          BCQUALITY_COUNTRIES: ''
          BCQUALITY_APPLICATION_AREA: ''
          BCQUALITY_BC_VERSION: ''
          COPILOT_MODEL: ${{ needs.Settings.outputs.model }}
          COPILOT_REVIEW_CLI_VERSION: ${{ steps.copilot-cli.outputs.version }}
          BCQUALITY_CONSUME: plugin
          COPILOT_REVIEW_LEAF_MODEL: ${{ needs.Settings.outputs.leafModel }}
          COPILOT_REVIEW_LEAF_EXECUTION: serial
          COPILOT_REVIEW_MAX_LEAF_CONCURRENCY: '4'
          MINIMUM_SEVERITY: Medium
          AGENT_MINIMUM_SEVERITY: Medium
          MAX_FINDINGS_PER_DOMAIN: '25'
          COPILOT_REVIEW_FAIL_ON_PARSE_ERROR: true
          COPILOT_REVIEW_EMBED_DIFF: false
          COPILOT_REVIEW_CLI_TIMEOUT_MINUTES: '30'
          COPILOT_REVIEW_AGENT_LABEL: copilot-pr-review
          COPILOT_REVIEW_AGENT_VERSION: ''
          COPILOT_REVIEW_AGENT_RELEASE_DATE: ''
          COPILOT_REVIEW_AGENT_RELEASE_VERSION: ''
          BASE_BRANCH: ${{ needs.resolve.outputs.base_ref }}
        run: |
          & "${{ github.workspace }}/engine/Review/ALReviewAgent/scripts/Invoke-CopilotPRReview.ps1"

      - name: Upload review output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copilot-pr-review-output-${{ needs.resolve.outputs.pr_number }}
          path: ${{ github.workspace }}/review-output
          if-no-files-found: warn

      - name: Upload BCQuality filter report
        if: always() && steps.bcquality.outputs.filterReport != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bcquality-filter-report-${{ needs.resolve.outputs.pr_number }}
          path: ${{ steps.bcquality.outputs.filterReport }}
          if-no-files-found: warn

  publish:
    needs: [resolve, review]
    if: ${{ needs.review.result == 'success' && needs.resolve.outputs.pr_number != '' && needs.resolve.outputs.head_sha != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout engine scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          path: engine
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted target base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.resolve.outputs.base_ref }}
          path: trusted
          fetch-depth: 0
          token: ${{ github.token }}
          # This job holds issues/pull-requests:write but posts via the GitHub
          # API (not git push), so it needs no stored credentials.
          persist-credentials: false

      - name: Install powershell-yaml
        run: |
          if (-not (Get-Module -ListAvailable -Name powershell-yaml)) {
            Install-Module powershell-yaml -Scope CurrentUser -Force -AllowClobber
          }

      - name: Download review output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: copilot-pr-review-output-${{ needs.resolve.outputs.pr_number }}
          path: ${{ github.workspace }}/review-output

      - name: Run Copilot PR review (post comments)
        env:
          REVIEW_PHASE: post
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REVIEW_WORKSPACE: ${{ github.workspace }}/trusted
          REVIEW_OUTPUT_DIR: ${{ github.workspace }}/review-output
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          PR_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          BCQUALITY_SHA: ${{ needs.review.outputs.bcquality_sha }}
          MINIMUM_SEVERITY: Medium
          AGENT_MINIMUM_SEVERITY: Medium
          MAX_FINDINGS_PER_DOMAIN: '25'
          COPILOT_REVIEW_POST_SUMMARY: false
          COPILOT_REVIEW_FAIL_ON_PARSE_ERROR: true
          COPILOT_REVIEW_AGENT_LABEL: copilot-pr-review
          COPILOT_REVIEW_AGENT_VERSION: ''
          COPILOT_REVIEW_AGENT_RELEASE_DATE: ''
          COPILOT_REVIEW_AGENT_RELEASE_VERSION: ''
          BASE_BRANCH: ${{ needs.resolve.outputs.base_ref }}
        run: |
          & "${{ github.workspace }}/engine/Review/ALReviewAgent/scripts/Invoke-CopilotPRReview.ps1"

      - name: Upload published review artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copilot-pr-review-final-${{ needs.resolve.outputs.pr_number }}
          path: ${{ github.workspace }}/review-output
          if-no-files-found: warn

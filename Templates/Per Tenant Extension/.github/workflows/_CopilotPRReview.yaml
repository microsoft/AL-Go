name: _Copilot PR Review

on:
  workflow_call:
    inputs:
      workflowRunId:
        description: ID of the completed intake workflow run
        required: true
        type: number
      workflowHeadSha:
        description: Head SHA reported by the completed intake workflow
        required: true
        type: string
    secrets:
      BCQUALITY_TOKEN:
        description: Token used to install the private BCQuality marketplace plugin
        required: true

defaults:
  run:
    shell: pwsh

env:
  ALGoOrgSettings: ${{ vars.ALGoOrgSettings }}
  ALGoRepoSettings: ${{ vars.ALGoRepoSettings }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  Settings:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      enabled: ${{ steps.context.outputs.enabled }}
      model: ${{ steps.context.outputs.model }}
      leafModel: ${{ steps.context.outputs.leafModel }}
      eligible: ${{ steps.context.outputs.eligible }}
      prNumber: ${{ steps.context.outputs.prNumber }}
      headSha: ${{ steps.context.outputs.headSha }}
      baseRef: ${{ steps.context.outputs.baseRef }}
    steps:
      - name: Checkout trusted settings
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download pull request metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: copilot-pr-review-metadata
          path: .copilot-pr-review-metadata
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.workflowRunId }}

      - name: Read settings
        uses: microsoft/AL-Go-Actions/ReadSettings@main
        with:
          shell: pwsh
          project: ''
          workflowName: ''
          get: CodeReviewAgent

      - name: Resolve review context
        id: context
        uses: microsoft/AL-Go-Actions/CopilotPRReview@main
        with:
          shell: pwsh
          phase: context
          settingsJson: ${{ env.CodeReviewAgent }}
          metadataPath: .copilot-pr-review-metadata/event.json
          workflowHeadSha: ${{ inputs.workflowHeadSha }}
          token: ${{ github.token }}
          repository: ${{ github.repository }}

  review:
    needs: Settings
    if: needs.Settings.outputs.enabled == 'true' && needs.Settings.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      copilot-requests: write
    outputs:
      bcquality_sha: ${{ steps.prepare.outputs.bcqualitySha }}
    steps:
      - name: Checkout trusted target base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.Settings.outputs.baseRef }}
          path: trusted
          fetch-depth: 0
          token: ${{ github.token }}
          # The tool-enabled Copilot CLI runs in this job; do not leave a token
          # in .git/config where a successful prompt-injection could read it.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Prepare Copilot PR review
        id: prepare
        uses: microsoft/AL-Go-Actions/CopilotPRReview@main
        with:
          shell: pwsh
          phase: prepare
          bcqualityToken: ${{ secrets.BCQUALITY_TOKEN }}

      - name: Run Copilot PR review
        uses: microsoft/AL-Go-Actions/CopilotPRReview@main
        with:
          shell: pwsh
          phase: generate
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          prNumber: ${{ needs.Settings.outputs.prNumber }}
          prHeadSha: ${{ needs.Settings.outputs.headSha }}
          baseRef: ${{ needs.Settings.outputs.baseRef }}
          model: ${{ needs.Settings.outputs.model }}
          leafModel: ${{ needs.Settings.outputs.leafModel }}
          reviewWorkspace: ${{ github.workspace }}/trusted
          reviewOutputDir: ${{ github.workspace }}/review-output
          bcqualityRoot: ${{ steps.prepare.outputs.bcqualityRoot }}
          bcqualitySha: ${{ steps.prepare.outputs.bcqualitySha }}
          copilotCliVersion: ${{ steps.prepare.outputs.copilotCliVersion }}

      - name: Upload review output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copilot-pr-review-output-${{ needs.Settings.outputs.prNumber }}
          path: ${{ github.workspace }}/review-output
          if-no-files-found: warn

      - name: Upload BCQuality filter report
        if: always() && steps.prepare.outputs.filterReport != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bcquality-filter-report-${{ needs.Settings.outputs.prNumber }}
          path: ${{ steps.prepare.outputs.filterReport }}
          if-no-files-found: warn

  publish:
    needs: [Settings, review]
    if: needs.review.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted target base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.Settings.outputs.baseRef }}
          path: trusted
          fetch-depth: 0
          token: ${{ github.token }}
          # This job holds issues/pull-requests:write but posts via the GitHub
          # API (not git push), so it needs no stored credentials.
          persist-credentials: false

      - name: Download review output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: copilot-pr-review-output-${{ needs.Settings.outputs.prNumber }}
          path: ${{ github.workspace }}/review-output

      - name: Publish Copilot PR review
        uses: microsoft/AL-Go-Actions/CopilotPRReview@main
        with:
          shell: pwsh
          phase: post
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          prNumber: ${{ needs.Settings.outputs.prNumber }}
          prHeadSha: ${{ needs.Settings.outputs.headSha }}
          baseRef: ${{ needs.Settings.outputs.baseRef }}
          reviewWorkspace: ${{ github.workspace }}/trusted
          reviewOutputDir: ${{ github.workspace }}/review-output
          bcqualitySha: ${{ needs.review.outputs.bcquality_sha }}

      - name: Upload published review artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copilot-pr-review-final-${{ needs.Settings.outputs.prNumber }}
          path: ${{ github.workspace }}/review-output
          if-no-files-found: warn

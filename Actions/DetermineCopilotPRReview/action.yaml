name: Determine Copilot PR Review
author: Microsoft Corporation
inputs:
  shell:
    description: Shell in which you want to run the action (powershell or pwsh)
    required: false
    default: powershell
  token:
    description: GitHub token used to read pull request metadata
    required: false
    default: ${{ github.token }}
  repository:
    description: Repository containing the pull request
    required: false
    default: ${{ github.repository }}
  pullRequestNumber:
    description: Pull request number from the workflow-run payload
    required: false
    default: ''
  workflowHeadSha:
    description: Head SHA from the workflow-run payload
    required: true
  workflowHeadOwner:
    description: Head repository owner from the workflow-run payload
    required: false
    default: ''
  workflowHeadBranch:
    description: Head branch from the workflow-run payload
    required: false
    default: ''
  codeReviewAgent:
    description: CodeReviewAgent repository setting as compressed JSON
    required: true
outputs:
  enabled:
    description: Whether Copilot code review is enabled
    value: ${{ steps.determinecopilotprreview.outputs.enabled }}
  eligible:
    description: Whether the resolved pull request is eligible for review
    value: ${{ steps.determinecopilotprreview.outputs.eligible }}
  prNumber:
    description: Resolved pull request number
    value: ${{ steps.determinecopilotprreview.outputs.prNumber }}
  headSha:
    description: Resolved pull request head SHA
    value: ${{ steps.determinecopilotprreview.outputs.headSha }}
  baseRef:
    description: Resolved pull request base branch
    value: ${{ steps.determinecopilotprreview.outputs.baseRef }}
  model:
    description: Copilot consolidation model
    value: ${{ steps.determinecopilotprreview.outputs.model }}
  leafModel:
    description: Copilot leaf-review model
    value: ${{ steps.determinecopilotprreview.outputs.leafModel }}
runs:
  using: composite
  steps:
    - name: run
      shell: ${{ inputs.shell }}
      id: determinecopilotprreview
      env:
        _token: ${{ inputs.token }}
        _repository: ${{ inputs.repository }}
        _pullRequestNumber: ${{ inputs.pullRequestNumber }}
        _workflowHeadSha: ${{ inputs.workflowHeadSha }}
        _workflowHeadOwner: ${{ inputs.workflowHeadOwner }}
        _workflowHeadBranch: ${{ inputs.workflowHeadBranch }}
        _codeReviewAgent: ${{ inputs.codeReviewAgent }}
      run: |
        ${{ github.action_path }}/../Invoke-AlGoAction.ps1 -ActionName "DetermineCopilotPRReview" -Action {
          ${{ github.action_path }}/DetermineCopilotPRReview.ps1 -token $ENV:_token -repository $ENV:_repository -pullRequestNumber $ENV:_pullRequestNumber -workflowHeadSha $ENV:_workflowHeadSha -workflowHeadOwner $ENV:_workflowHeadOwner -workflowHeadBranch $ENV:_workflowHeadBranch -codeReviewAgent $ENV:_codeReviewAgent
        }
branding:
  icon: terminal
  color: blue

name: Pull Request Status Check
author: Microsoft Corporation
inputs:
  shell:
    description: Shell in which you want to run the action (powershell or pwsh)
    required: false
    default: powershell
  optionalPatternsForPrValidationJson:
    description: Optional build job wildcard patterns in JSON array format
    required: false
    default: '[]'
outputs:
  failedOptionalJobs:
    description: JSON array of failed optional build job names
    value: ${{ steps.pullrequeststatuscheck.outputs.failedOptionalJobs }}
runs:
  using: composite
  steps:
    - name: run
      shell: ${{ inputs.shell }}
      id: pullrequeststatuscheck
      env:
        _optionalPatternsForPrValidationJson: ${{ inputs.optionalPatternsForPrValidationJson }}
      run: |
        ${{ github.action_path }}/../Invoke-AlGoAction.ps1 -ActionName "PullRequestStatusCheck" -Action {
          ${{ github.action_path }}/PullRequestStatusCheck.ps1 -optionalPatternsForPrValidationJson $ENV:_optionalPatternsForPrValidationJson
        }
branding:
  icon: terminal
  color: blue

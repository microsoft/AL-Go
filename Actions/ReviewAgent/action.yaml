name: Review Agent
author: Microsoft Corporation
inputs:
  shell:
    description: Shell in which you want to run the action (powershell or pwsh)
    required: false
    default: pwsh
  phase:
    description: Review phase to run (context, prepare, generate, or post)
    required: true
  settingsJson:
    description: CodeReviewAgent settings as compressed JSON
    required: false
    default: ''
  metadataPath:
    description: Path to the pull request event metadata
    required: false
    default: ''
  workflowHeadSha:
    description: Head SHA reported by the completed intake workflow
    required: false
    default: ''
  token:
    description: GitHub token used for pull request access
    required: false
    default: ${{ github.token }}
  repository:
    description: GitHub owner/repository being reviewed
    required: false
    default: ${{ github.repository }}
  prNumber:
    description: Pull request number
    required: false
    default: ''
  prHeadSha:
    description: Pull request head SHA
    required: false
    default: ''
  baseRef:
    description: Pull request base branch
    required: false
    default: main
  model:
    description: Model used for final review consolidation
    required: false
    default: ''
  leafModel:
    description: Model used for isolated leaf reviews
    required: false
    default: ''
  reviewWorkspace:
    description: Trusted base-branch checkout used by the reviewer
    required: false
    default: ''
  reviewOutputDir:
    description: Directory used for generated review artifacts
    required: false
    default: ''
  bcqualityToken:
    description: Token with read access to a private BCQuality marketplace
    required: false
    default: ''
  bcqualityMarketplaceRepo:
    description: GitHub repository URL containing the BCQuality marketplace
    required: false
    default: https://github.com/microsoft/BCQuality
  bcqualityVersion:
    description: BCQuality content version
    required: false
    default: '1.7'
  bcqualityRoot:
    description: Path to the installed and filtered BCQuality plugin
    required: false
    default: ''
  copilotCliVersion:
    description: Compatibility-validated Copilot CLI version
    required: false
    default: 1.0.88
outputs:
  eligible:
    description: Whether the pull request is eligible for review
    value: ${{ steps.reviewagent.outputs.eligible }}
  model:
    description: Model used for final review consolidation
    value: ${{ steps.reviewagent.outputs.model }}
  leafModel:
    description: Model used for isolated leaf reviews
    value: ${{ steps.reviewagent.outputs.leafModel }}
  prNumber:
    description: Validated pull request number
    value: ${{ steps.reviewagent.outputs.prNumber }}
  headSha:
    description: Validated pull request head SHA
    value: ${{ steps.reviewagent.outputs.headSha }}
  baseRef:
    description: Validated pull request base branch
    value: ${{ steps.reviewagent.outputs.baseRef }}
  bcqualityMarketplaceRepo:
    description: Trusted BCQuality marketplace repository
    value: ${{ steps.reviewagent.outputs.bcqualityMarketplaceRepo }}
  bcqualityVersion:
    description: Configured BCQuality content version
    value: ${{ steps.reviewagent.outputs.bcqualityVersion }}
  bcqualityRoot:
    description: Path to the installed and filtered BCQuality plugin
    value: ${{ steps.reviewagent.outputs.bcqualityRoot }}
  filterReport:
    description: Path to the BCQuality filter report
    value: ${{ steps.reviewagent.outputs.filterReport }}
  copilotCliVersion:
    description: Installed Copilot CLI version
    value: ${{ steps.reviewagent.outputs.copilotCliVersion }}
runs:
  using: composite
  steps:
    - name: run
      shell: ${{ inputs.shell }}
      id: reviewagent
      env:
        _phase: ${{ inputs.phase }}
        _settingsJson: ${{ inputs.settingsJson }}
        _metadataPath: ${{ inputs.metadataPath }}
        _workflowHeadSha: ${{ inputs.workflowHeadSha }}
        _token: ${{ inputs.token }}
        _repository: ${{ inputs.repository }}
        _prNumber: ${{ inputs.prNumber }}
        _prHeadSha: ${{ inputs.prHeadSha }}
        _baseRef: ${{ inputs.baseRef }}
        _model: ${{ inputs.model }}
        _leafModel: ${{ inputs.leafModel }}
        _reviewWorkspace: ${{ inputs.reviewWorkspace }}
        _reviewOutputDir: ${{ inputs.reviewOutputDir }}
        _bcqualityToken: ${{ inputs.bcqualityToken }}
        _bcqualityMarketplaceRepo: ${{ inputs.bcqualityMarketplaceRepo }}
        _bcqualityVersion: ${{ inputs.bcqualityVersion }}
        _bcqualityRoot: ${{ inputs.bcqualityRoot }}
        _copilotCliVersion: ${{ inputs.copilotCliVersion }}
      run: |
        ${{ github.action_path }}/../Invoke-AlGoAction.ps1 -ActionName "ReviewAgent" -Action {
          ${{ github.action_path }}/ReviewAgent.ps1 -phase $ENV:_phase -settingsJson $ENV:_settingsJson -metadataPath $ENV:_metadataPath -workflowHeadSha $ENV:_workflowHeadSha -token $ENV:_token -repository $ENV:_repository -prNumber $ENV:_prNumber -prHeadSha $ENV:_prHeadSha -baseRef $ENV:_baseRef -model $ENV:_model -leafModel $ENV:_leafModel -reviewWorkspace $ENV:_reviewWorkspace -reviewOutputDir $ENV:_reviewOutputDir -bcqualityToken $ENV:_bcqualityToken -bcqualityMarketplaceRepo $ENV:_bcqualityMarketplaceRepo -bcqualityVersion $ENV:_bcqualityVersion -bcqualityRoot $ENV:_bcqualityRoot -copilotCliVersion $ENV:_copilotCliVersion
        }
branding:
  icon: terminal
  color: blue
